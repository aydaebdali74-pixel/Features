<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="scss/style.css">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.css">
</head>

<body>
    <!-- Features -->

    <section>

        <div>
            <h1><b>Features</b></h1>
            <p>This app is just so lorem ipsum.</p>

            <div id="icon">
                <div>
                    <i class="fa fa-bolt" id="fast"></i>
                    <p>Fast</p>
                </div>
                <div>
                    <i class="fa fa-heart" id="loved"></i>
                    <p>Loved</p>
                </div>
                <div>
                    <i class="fa fa-camera" id="clarity"></i>
                    <p>Clarity</p>
                </div>
                <div>
                    <i class="fa-solid fa-battery-full" id="power"></i>
                    <p>Power</p>
                </div>
                <div>
                    <i class="fa-regular fa-gem" id="sharp"></i>
                    <p>Sharp</p>
                </div>
                <div>
                    <i class="fa fa-cloud" id="cloud"></i>
                    <p>Cloud</p>
                </div>
                <div>
                    <i class="fa fa-globe" id="global"></i>
                    <p>Global</p>
                </div>
                <div>
                    <i class="fa-regular fa-hard-drive" id="storage"></i>
                    <p>Storage</p>
                </div>
                <div>
                    <i class="fa fa-user" id="safe"></i>
                    <p>Safe</p>
                </div>
                <div>
                    <i class="fa fa-shield" id="stable"></i>
                    <p>Stable</p>
                </div>
                <div>
                    <i class="fa fa-wifi" id="connected"></i>
                    <p>Connected</p>
                </div>
                <div>
                    <i class="fa fa-image" id="hd"></i>
                    <p>HD</p>
                </div>
            </div>
        </div>
    </section>
    <section id="table">
        <div class="pricing-card">
                <ul class="pricing-features">
                    <li id="pricing-titles">Premium</li>
                    <li><b>1000</b> Photos </li>
                    <li> <b>50</b>Features</li>
                    <li> <b>No </b>Ads</li>
                    <li> <b>Endless </b>Support</li>
                    <li>
                        <div class="pricing-amount">$99</div>
                    </li>
                </ul>

                <div class="button">
                    <button class="pricing-button">Download</button>
                </div>

            </div>
            <div class="pricing-card">
                <ul class="pricing-features">
                    <li class="pricing-title">Basic</li>
                    <li><b>250 </b> Photos</li>
                    <li> <b>10</b>Features</li>
                    <li> <b>No</b>Ads</li>
                    <li> <b>Office hours</b>Support</li>
                    <li>
                        <div class="pricing-amount">$25</div>
                    </li>
                </ul>
                <div class="button">
                    <button class="pricing-button">Download</button>
                </div>

            </div>
    </section>



</body>

</html>
